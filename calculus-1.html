<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculus I | Math Videos</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <a class="site-title" href="index.html">
        Math Videos
      </a>

      <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="calculus-1.html">Calculus I</a>
        <a href="calculus-2.html">Calculus II</a>
        <a href="calculus-3.html">Calculus III</a>
      </nav>

    </div>
  </header>

  <section class="course-hero">
    <div class="course-hero-content">

      <p class="eyebrow">
        CALCULUS I
      </p>

      <h1>Calculus I</h1>

      <p>
        Video explanations and worked examples covering
        limits, derivatives, and applications of differentiation.
      </p>

    </div>
  </section>

 <main>

  <div id="video-library"></div>

</main>

  <footer>
    <p>
      © Burcu Karabina · Mathematics Video Library
    </p>
  </footer>
<script>
  const currentCourse = "calculus-1";
</script>

<script src="videos.js"></script>
<script src="course.js"></script>

<script>
  const library = document.getElementById("video-library");

  const calculusVideos = videos.filter(
    video => video.course === "calculus-1"
  );

  const sections = [
    ...new Set(calculusVideos.map(video => video.section))
  ];

  sections.forEach(sectionName => {

    const section = document.createElement("section");
    section.className = "video-section";

    const heading = document.createElement("h2");
    heading.textContent = sectionName;

    section.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "video-grid";

    const sectionVideos = calculusVideos.filter(
      video => video.section === sectionName
    );

    sectionVideos.forEach(video => {

      const card = document.createElement("article");
      card.className = "video-card";

      let videoDisplay;

      if (video.youtubeId) {

        videoDisplay = `
          <div class="video-wrapper">
            <iframe
              src="https://www.youtube-nocookie.com/embed/${video.youtubeId}"
              title="${video.title}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen>
            </iframe>
          </div>
        `;

      } else {

        videoDisplay = `
          <div class="video-placeholder">
            Video coming soon
          </div>
        `;
      }

      card.innerHTML = `
        ${videoDisplay}

        <div class="video-card-content">

          <p class="video-topic">
            ${video.topic.toUpperCase()}
          </p>

          <h3>${video.title}</h3>

          <p>
            ${video.description}
          </p>

        </div>
      `;

      grid.appendChild(card);
    });

    section.appendChild(grid);
    library.appendChild(section);

  });
</script>
</body>
</html>
